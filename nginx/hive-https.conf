# Hive Finance — HTTPS via Tailscale cert
# Deploy: sudo cp /home/zach/hive/nginx/hive-https.conf /etc/nginx/sites-available/hive
#         sudo ln -sf /etc/nginx/sites-available/hive /etc/nginx/sites-enabled/hive
#         sudo rm -f /etc/nginx/sites-enabled/finance-api
#         sudo nginx -t && sudo systemctl reload nginx

upstream hive_backend {
    server 127.0.0.1:8000;
}

upstream hive_frontend {
    server 127.0.0.1:3010;
}

# HTTP → redirect to HTTPS
server {
    listen 80;
    server_name hive.savannah-chimaera.ts.net;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name hive.savannah-chimaera.ts.net;

    ssl_certificate     /home/zach/hive/nginx/certs/hive.crt;
    ssl_certificate_key /home/zach/hive/nginx/certs/hive.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 10M;

    # API → FastAPI backend
    location /api/ {
        proxy_pass http://hive_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Next.js hot-reload websocket
    location /_next/webpack-hmr {
        proxy_pass http://hive_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Everything else → Next.js frontend
    location / {
        proxy_pass http://hive_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
