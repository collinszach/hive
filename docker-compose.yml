services:
  postgres:
    image: postgres:16
    network_mode: host
    command: postgres -c listen_addresses=127.0.0.1
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    network_mode: host
    command: redis-server --bind 127.0.0.1 --port 6380 --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: ./backend
    network_mode: host
    env_file: .env
    environment:
      POSTGRES_HOST: "127.0.0.1"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@127.0.0.1:6380/0"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD}@127.0.0.1:6380/0"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD}@127.0.0.1:6380/1"
    volumes:
      - tax-docs:/data/tax-docs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8005/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  celery_worker:
    build: ./backend
    network_mode: host
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4 -Q celery,default
    env_file: .env
    environment:
      POSTGRES_HOST: "127.0.0.1"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@127.0.0.1:6380/0"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD}@127.0.0.1:6380/0"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD}@127.0.0.1:6380/1"
    volumes:
      - ./backups:/var/backups/hive
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  celery_beat:
    build: ./backend
    network_mode: host
    command: celery -A app.celery_app beat --loglevel=info --scheduler=celery.beat.PersistentScheduler --schedule=/var/celery/celerybeat-schedule
    env_file: .env
    environment:
      POSTGRES_HOST: "127.0.0.1"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@127.0.0.1:6380/0"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD}@127.0.0.1:6380/0"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD}@127.0.0.1:6380/1"
    volumes:
      - celery_beat_data:/var/celery
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  nginx:
    image: nginx:alpine
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  postgres_data:
  celery_beat_data:
  tax-docs:
