name: HIVE
options:
  bundleIdPrefix: com.zacharyjcollins
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: K28M38H7Y5
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.1.0"
  LinkKit:
    url: https://github.com/plaid/plaid-link-ios
    from: "6.4.0"
targets:
  HIVE:
    type: application
    platform: iOS
    sources:
      - path: HIVE
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: LinkKit
        product: LinkKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zacharyjcollins.hive
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: HIVE/Resources/HIVE.entitlements
      properties:
        # development for dev/TestFlight-debug builds; Xcode/App Store flips to production.
        aps-environment: development
    info:
      path: HIVE/Resources/Info.plist
      properties:
        CFBundleDisplayName: HIVE
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: HIVE uses Face ID to lock your financial data so only you can open the app.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - remote-notification
        # === Google Sign-In (fill in from Google Cloud Console → iOS OAuth client) ===
        # GIDClientID is the iOS client id; the URL scheme is its REVERSED form.
        # Placeholders below let the project build; sign-in works once real values land.
        GIDClientID: 522735463598-ua1344cfd6d6elgiric47g1qk01ma9f8.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.522735463598-ua1344cfd6d6elgiric47g1qk01ma9f8
